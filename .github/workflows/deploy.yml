# .github/workflows/deploy.yml
# Copy into each app repo. Push to main -> auto-deploys within ~30s.
# Requires repo Secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_PORT

name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            /opt/scripts/deploy.sh spliteven
